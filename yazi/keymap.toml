[mgr]
prepend_keymap = [
  # Mount Plugin
  { on = ["M", "m",], run = "plugin mount", desc = "Open mount manager" },
  { on = ["M", "a",], run = "plugin gvfs -- select-then-mount --jump", desc = "MTP/Android Mount" },

  # Recycle Bin Actions
  { on = ["R","b"], run = "plugin recycle-bin --launch",    desc = "Open Recycle Bin menu" },
  { on = ["R","o"], run = "plugin recycle-bin --open",      desc = "Open Trash" },
  { on = ["R","e"], run = "plugin recycle-bin --empty",     desc = "Empty Trash" },
  { on = ["R","D"], run = "plugin recycle-bin --emptyDays", desc = "Empty by days deleted" },
  { on = ["R","d"], run = "plugin recycle-bin --delete",    desc = "Delete from Trash" },
  { on = ["R","r"], run = "plugin recycle-bin --restore",   desc = "Restore from Trash" },

  # Tabs and System
  { on = "T", run = "tab_close", desc = "Close tab" },
  { on = "<C-t>", run = 'shell "setsid kitty &" --block', desc = "Open terminal here" },
  { on = "B", run = 'shell "dragon-drop -x \"$@\"" --confirm', desc = "Drag and drop" },

# Compression Selection Menu (c -> c)
  { on = ["c", "c", "1"], run = 'shell "tar -czf \"$PWD/${1##*/}.tar.gz\" -C \"$PWD\" -- \"${@##*/}\"" --confirm', desc = "Create .tar.gz" },
  { on = ["c", "c", "2"], run = 'shell "cd \"$PWD\" && zip -r \"$PWD/${1##*/}.zip\" -- \"${@##*/}\"" --confirm',    desc = "Create .zip" },
  { on = ["c", "c", "3"], run = 'shell "cd \"$PWD\" && 7z a \"$PWD/${1##*/}.7z\" -- \"${@##*/}\"" --confirm',     desc = "Create .7z" },

# Extract archive (c -> x)
  { on = ["c", "x"], run = '''shell "
  for f in \"$@\"; do
    base=$(basename \"$f\")
    name=$(echo \"$base\" | sed 's/\\.tar\\.gz$//;s/\\.tar\\.bz2$//;s/\\.tar\\.xz$//;s/\\.tar\\.zst$//;s/\\.tar$//;s/\\.zip$//;s/\\.7z$//;s/\\.rar$//')
    dest=\"$name\"
    n=2
    while [ -e \"$dest\" ]; do
      dest=\"${name}${n}\"
      n=$((n+1))
    done
    tmp=\"${dest}__tmp\"
    ouch decompress \"$f\" --dir \"$tmp\" --yes
    mkdir -p \"$dest\"
    (shopt -s dotglob; mv \"$tmp\"/*/* \"$dest\"/ 2>/dev/null || mv \"$tmp\"/* \"$dest\"/)
    rm -rf \"$tmp\"
  done
  " --confirm''', desc = "Extract archive(s)" }
]
