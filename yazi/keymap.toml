[mgr]
prepend_keymap = [
  # Mount Plugin
  { on = ["M", "m",], run = "plugin mount", desc = "Open mount manager" },
  { on = ["M", "a",], run = "plugin gvfs -- select-then-mount --jump", desc = "MTP/Android Mount" },

  # Recycle Bin Actions
  { on = ["R","b"], run = "plugin recycle-bin --launch",    desc = "Open Recycle Bin menu" },
  { on = ["R","o"], run = "plugin recycle-bin --open",      desc = "Open Trash" },
  { on = ["R","e"], run = "plugin recycle-bin --empty",     desc = "Empty Trash" },
  { on = ["R","D"], run = "plugin recycle-bin --emptyDays", desc = "Empty by days deleted" },
  { on = ["R","d"], run = "plugin recycle-bin --delete",    desc = "Delete from Trash" },
  { on = ["R","r"], run = "plugin recycle-bin --restore",   desc = "Restore from Trash" },

  # Tabs and System
  { on = "W", run = "close", desc = "Close tab" },
  { on = "B", run = 'shell "dragon-drop -x \"$@\"" --confirm', desc = "Drag and drop" },
  { on = "T", run = 'shell "setsid kitty" --workdir "$PWD" &', desc = "Open terminal here"},

# Compression Selection Menu (c -> x)
  { on = ["c", "x", "1"], run = 'shell "ouch compress \"$@\" \"$PWD/${1##*/}.zip\"" --confirm',    desc = "Force .zip" },
  { on = ["c", "x", "2"], run = 'shell "ouch compress \"$@\" \"$PWD/${1##*/}.tar.gz\"" --confirm', desc = "Force .tar.gz" },
  { on = ["c", "x", "3"], run = 'shell "ouch compress \"$@\" \"$PWD/${1##*/}.7z\"" --confirm',     desc = "Force .7z" }
]
