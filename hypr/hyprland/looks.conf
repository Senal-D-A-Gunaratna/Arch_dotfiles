#####################
### LOOK AND FEEL ###
#####################


general {
    gaps_in = 3
    gaps_out = 5

    border_size = 1

    col.active_border = $active_border

    resize_on_border = false

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}
decoration {
    rounding = 10
    rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = false
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

# QT Theming
env = QT_QPA_PLATFORMTHEME,hyprqt6engine


animations {
    enabled = yes, please :)

    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1


    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = border,        1,     4.5,   easeOutQuint
    animation = windows,       1,     3.5,   easeOutQuint
    animation = windowsIn,     1,     3,     easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.2,   linear,       popin 87%
    animation = fadeIn,        1,     1.3,   almostLinear
    animation = fadeOut,       1,     1.1,   almostLinear
    animation = fade,          1,     2,     quick
    animation = layers,        1,     3,     easeOutQuint
    animation = layersIn,      1,     3,     easeOutQuint, fade
    animation = layersOut,     1,     1.2,   linear,       fade
    animation = fadeLayersIn,  1,     1.4,   almostLinear
    animation = fadeLayersOut, 1,     1.1,   almostLinear
    animation = workspaces,    1,     3,     easeOutQuint, slide
    animation = workspacesIn,  1,     3,     easeOutQuint, slide
    animation = workspacesOut, 1,     3,     easeOutQuint, slide
    animation = zoomFactor,    1,     5.5,   quick
}

dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}


master {
    new_status = master
}


misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}

