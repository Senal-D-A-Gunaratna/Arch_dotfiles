windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

# wayapper menu
windowrule {
    name = waypaper-float
    match:class = waypaper

    float = yes
    center = yes
    size = 800 780
}

# opacity
windowrule = opacity 0.8 0.85, match:class codium
windowrule = opacity 0.75 0.8, match:class localsend
#windowrule = opacity 0.7 0.8, match:class kitty

# Apply opacity ONLY to kitty windows whose title contains nvim
windowrule = match:class kitty, match:title nvim, opacity 0.7 0.8
